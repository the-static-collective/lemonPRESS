name: AUDIO-KEY-005 digital marker proof
on:
  push:
    branches:
      - experiment/fencepost-audio-key-005
  pull_request:
    paths:
      - 'experiments/fencepost-001/audio-key*'
      - 'experiments/fencepost-001/world-doors*'
      - 'experiments/fencepost-001/AUDIO-KEY-005.md'
      - '.github/workflows/audio-key-005.yml'
jobs:
  capsule:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/fencepost-001/audio-key.test.mjs experiments/fencepost-001/world-doors.test.mjs
      - run: node experiments/fencepost-001/audio-key.mjs demo /tmp/audio-key-proof
      - run: node experiments/fencepost-001/audio-key.mjs verify /tmp/audio-key-proof
