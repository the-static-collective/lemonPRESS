name: MACHINE-MANUSCRIPT-001 native held edition
on:
  pull_request:
    paths: ["machine-book/**",".github/workflows/machine-manuscript-001.yml"]
  push:
    branches: ["experiment/machine-manuscript-001"]
    paths: ["machine-book/**",".github/workflows/machine-manuscript-001.yml"]
permissions:
  contents: read
jobs:
  held-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test machine-book/edition.test.mjs
