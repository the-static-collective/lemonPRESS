name: FENCEPOST-001 offline proof
on:
  push:
    branches:
      - experiment/fencepost-reverse-seismograph-001
  pull_request:
    paths:
      - 'experiments/fencepost-001/**'
      - '.github/workflows/fencepost-001.yml'
jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/fencepost-001/fencepost.test.mjs experiments/fencepost-001/thermo-stylus.test.mjs
      - run: node experiments/fencepost-001/fencepost.mjs demo /tmp/fencepost-proof
      - run: node experiments/fencepost-001/fencepost.mjs verify /tmp/fencepost-proof
