name: Renji Relay
on: [push, pull_request]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: dcc8cdca84c440aa4294134f020fb7095bf87f24
          path: .relatte-runtime
      - run: npm install --prefix .relatte-runtime --omit=dev --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-style.txt
      - run: python -m unittest discover -s tests -p 'test_renji_relay.py'
        env:
          RELATTE_RUNTIME: ${{ github.workspace }}/.relatte-runtime
