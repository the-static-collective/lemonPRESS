name: 2DAY crawler

on:
  pull_request:
    paths:
      - "tools/suno_playlist_crawler.py"
      - "tests/test_suno_playlist_crawler.py"
      - "schemas/suno-playlist-crawl-v0.schema.json"
      - "works/2day-cycle-001/**"
      - ".github/workflows/2day-crawler.yml"
  push:
    branches:
      - "feat/2day-crawler-001"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler tests
        run: python -m unittest tests/test_suno_playlist_crawler.py -v

  live-crawl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public Suno playlist pages
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          spec=json.loads(Path("works/2day-cycle-001/sources.json").read_text())
          ua={"User-Agent":"Mozilla/5.0","Accept":"application/json"}
          rx=re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",re.I)
          for src in spec["sources"]:
              req=urllib.request.Request(src["public_url"],headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  final=r.geturl()
              pid=rx.search(final).group(0)
              print("\\nSOURCE",src["title"],"pid",pid,"final",final)
              seen=set()
              for page in range(1,6):
                  url=f"https://studio-api.prod.suno.com/api/playlist/{pid}/?page={page}"
                  req=urllib.request.Request(url,headers=ua)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  items=data.get("playlist_clips") or data.get("clips") or []
                  print(" page",page,"items",len(items),"keys",sorted(data.keys()))
                  if not items:
                      break
                  new=0
                  for j,it in enumerate(items,1):
                      clip=it.get("clip") if isinstance(it,dict) and isinstance(it.get("clip"),dict) else it
                      cid=clip.get("id") if isinstance(clip,dict) else None
                      title=clip.get("title") if isinstance(clip,dict) else None
                      status=clip.get("status") if isinstance(clip,dict) else None
                      print("  ",j,"id",cid,"title",repr(title),"status",status)
                      key=cid or json.dumps(clip,sort_keys=True,default=str)
                      if key not in seen:
                          seen.add(key); new+=1
                  if new==0:
                      print("  NO NEW ITEMS -- stop")
                      break
              print(" unique",len(seen))
          PY
      - name: Crawl four public 2DAY playlists
        run: |
          python tools/suno_playlist_crawler.py press \
            works/2day-cycle-001/sources.json \
            --out /tmp/2day-crawl
      - name: Assert exact public-source result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          crawl = json.loads(Path("/tmp/2day-crawl/crawl.json").read_text())
          playdeck = json.loads(Path("/tmp/2day-crawl/playdeck-cycle.json").read_text())
          assert crawl["track_count"] == 39, crawl["track_count"]
          assert playdeck["track_count"] == 39, playdeck["track_count"]
          assert playdeck["loop"] is True
          assert [n["next_playlist_slot"] for n in playdeck["playlist_nodes"]] == [2, 3, 4, 1]
          print("LIVE 2DAY CRAWL: 39 track occurrences; cycle 1->2->3->4->1")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 2day-live-crawl
          path: /tmp/2day-crawl
          if-no-files-found: error
