name: 2DAY crawler

on:
  pull_request:
    paths:
      - "tools/suno_playlist_crawler.py"
      - "tests/test_suno_playlist_crawler.py"
      - "schemas/suno-playlist-crawl-v0.schema.json"
      - "works/2day-cycle-001/**"
      - ".github/workflows/2day-crawler.yml"
  push:
    branches:
      - "feat/2day-crawler-001"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler tests
        run: python -m unittest tests/test_suno_playlist_crawler.py -v

  live-crawl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect first public Suno carrier
        run: |
          curl -L -sS -A 'Mozilla/5.0' \
            -o /tmp/suno-first.html \
            -w 'status=%{http_code} final=%{url_effective} bytes=%{size_download}\n' \
            'https://suno.com/s/zVsv2igtLOJDqzmX'
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[]
                  self.links=[]
                  self.meta=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="script" and a.get("src"):
                      self.scripts.append(a["src"])
                  if tag=="link":
                      self.links.append(a)
                  if tag=="meta":
                      self.meta.append(a)
          text=Path("/tmp/suno-first.html").read_text(errors="replace")
          p=P(); p.feed(text)
          print("html-bytes", len(text.encode()))
          print("scripts", p.scripts[:30])
          print("canonical", [x for x in p.links if "canonical" in (x.get("rel") or "")])
          print("og", [x for x in p.meta if (x.get("property") or "").startswith("og:")][:20])
          for needle in ["playlist","clip","__NEXT_DATA__","api/","trpc","graphql"]:
              print(needle, len(re.findall(re.escape(needle), text, re.I)))
          print("head", text[:3000])
          PY
      - name: Crawl four public 2DAY playlists
        run: |
          python tools/suno_playlist_crawler.py press \
            works/2day-cycle-001/sources.json \
            --out /tmp/2day-crawl
      - name: Assert exact public-source result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          crawl = json.loads(Path("/tmp/2day-crawl/crawl.json").read_text())
          playdeck = json.loads(Path("/tmp/2day-crawl/playdeck-cycle.json").read_text())
          assert crawl["track_count"] == 39, crawl["track_count"]
          assert playdeck["track_count"] == 39, playdeck["track_count"]
          assert playdeck["loop"] is True
          assert [n["next_playlist_slot"] for n in playdeck["playlist_nodes"]] == [2, 3, 4, 1]
          print("LIVE 2DAY CRAWL: 39 track occurrences; cycle 1->2->3->4->1")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 2day-live-crawl
          path: /tmp/2day-crawl
          if-no-files-found: error
